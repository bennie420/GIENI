# Google Cloud Build CI/CD Pipeline for Gieni OS
# Builds container images and deploys web and workers to Google Cloud Run

steps:
  # 1. Type-check & Run Test Suite
  - name: 'node:22-alpine'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        npm ci
        npm run type-check
        npm test

  # 2. Build Web Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'apps/web/Dockerfile'
      - '-t'
      - 'gcr.io/$PROJECT_ID/gieni-web:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/gieni-web:latest'
      - '.'

  # 3. Build Workers Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'apps/workers/Dockerfile'
      - '-t'
      - 'gcr.io/$PROJECT_ID/gieni-workers:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/gieni-workers:latest'
      - '.'

  # 4. Push Web Container
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/gieni-web:$COMMIT_SHA']

  # 5. Push Workers Container
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/gieni-workers:$COMMIT_SHA']

  # 6. Deploy Web to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'gieni-web'
      - '--image'
      - 'gcr.io/$PROJECT_ID/gieni-web:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

  # 7. Deploy Workers to Google Cloud Run (Private/Internal)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'gieni-workers'
      - '--image'
      - 'gcr.io/$PROJECT_ID/gieni-workers:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--no-allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/gieni-web:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/gieni-workers:$COMMIT_SHA'
